apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hrms-mysql-backups
  namespace: north-western-province-council-production-2
  labels:
    app.kubernetes.io/name: hrms-mysql
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ocs-storagecluster-ceph-rbd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hrms-mysql-pre-migration-backup-20260902
  namespace: north-western-province-council-production-2
  labels:
    app.kubernetes.io/name: hrms-mysql
    app.kubernetes.io/component: pre-migration-backup
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hrms-mysql
        app.kubernetes.io/component: pre-migration-backup
    spec:
      restartPolicy: Never
      containers:
        - name: mysqldump
          image: image-registry.openshift-image-registry.svc:5000/north-western-province-council-production-2/hrms-mysql@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
          args:
            - |
              umask 077
              backup="/backup/hrms-pre-persistence-2026-09-02.sql.gz"
              temporary="${backup}.partial"

              if [[ -e "${backup}" || -e "${temporary}" ]]; then
                echo "Refusing to overwrite an existing backup artifact." >&2
                exit 1
              fi

              MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysqldump \
                --host=mysql-service \
                --port=3306 \
                --user=root \
                --single-transaction \
                --quick \
                --routines \
                --triggers \
                --events \
                --hex-blob \
                --set-gtid-purged=OFF \
                --no-tablespaces \
                --databases "${MYSQL_DATABASE}" \
                | gzip -9 > "${temporary}"

              gzip -t "${temporary}"
              mv "${temporary}" "${backup}"
              cd /backup
              sha256sum "$(basename "${backup}")" > "$(basename "${backup}").sha256"
              sync
              echo "Backup completed and checksum recorded."
          envFrom:
            - secretRef:
                name: hrms-mysql-credentials
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: backup
              mountPath: /backup
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: hrms-mysql-backups
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hrms-mysql-pre-migration-backup-verify-20260902
  namespace: north-western-province-council-production-2
  labels:
    app.kubernetes.io/name: hrms-mysql
    app.kubernetes.io/component: backup-verification
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hrms-mysql
        app.kubernetes.io/component: backup-verification
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: image-registry.openshift-image-registry.svc:5000/north-western-province-council-production-2/hrms-mysql@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
          args:
            - |
              cd /backup
              backup="hrms-pre-persistence-2026-09-02.sql.gz"
              test -s "${backup}"
              test -s "${backup}.sha256"
              sha256sum -c "${backup}.sha256"
              gzip -t "${backup}"
              stat --format='backup_bytes=%s permissions=%a' "${backup}"
              echo "Independent backup verification completed."
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: backup
              mountPath: /backup
              readOnly: true
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: hrms-mysql-backups
