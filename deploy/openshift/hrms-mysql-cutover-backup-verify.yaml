apiVersion: batch/v1
kind: Job
metadata:
  name: hrms-mysql-cutover-backup-verify-20260902
  namespace: north-western-province-council-production-2
  labels:
    app.kubernetes.io/name: hrms-mysql
    app.kubernetes.io/component: cutover-backup-verification
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hrms-mysql
        app.kubernetes.io/component: cutover-backup-verification
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: hrms-mysql-v2
              topologyKey: kubernetes.io/hostname
      containers:
        - name: verify
          image: image-registry.openshift-image-registry.svc:5000/north-western-province-council-production-2/hrms-mysql@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
          args:
            - |
              cd /backup
              backup="hrms-final-cutover-2026-09-02.sql.gz"
              test -s "${backup}"
              test -s "${backup}.sha256"
              sha256sum -c "${backup}.sha256"
              gzip -t "${backup}"
              stat --format='backup_bytes=%s permissions=%a' "${backup}"
              echo "Independent final cutover backup verification completed."
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: backup
              mountPath: /backup
              readOnly: true
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: hrms-mysql-backups
