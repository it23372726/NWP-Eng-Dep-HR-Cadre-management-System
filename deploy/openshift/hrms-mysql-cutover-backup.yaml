apiVersion: batch/v1
kind: Job
metadata:
  name: hrms-mysql-cutover-backup-20260902
  namespace: north-western-province-council-production-2
  labels:
    app.kubernetes.io/name: hrms-mysql
    app.kubernetes.io/component: cutover-backup
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hrms-mysql
        app.kubernetes.io/component: cutover-backup
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: mysql
              topologyKey: kubernetes.io/hostname
      containers:
        - name: mysqldump
          image: image-registry.openshift-image-registry.svc:5000/north-western-province-council-production-2/hrms-mysql@sha256:62fb722c78b24245ddff1796a0fcee4a49cc5b87e0aaaf20c92d1da9e0a2497b
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -euo
            - pipefail
            - -c
          args:
            - |
              umask 077
              backup="/backup/hrms-final-cutover-2026-09-02.sql.gz"
              temporary="${backup}.partial"

              if [[ -e "${backup}" || -e "${temporary}" ]]; then
                echo "Refusing to overwrite an existing cutover backup." >&2
                exit 1
              fi

              MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysqldump \
                --host=mysql-service \
                --port=3306 \
                --user=root \
                --single-transaction \
                --quick \
                --routines \
                --triggers \
                --events \
                --hex-blob \
                --set-gtid-purged=OFF \
                --no-tablespaces \
                --add-drop-database \
                --databases "${MYSQL_DATABASE}" \
                | gzip -9 > "${temporary}"

              gzip -t "${temporary}"
              mv "${temporary}" "${backup}"
              cd /backup
              sha256sum "$(basename "${backup}")" > "$(basename "${backup}").sha256"
              sync
              echo "Final cutover backup completed and checksum recorded."
          envFrom:
            - secretRef:
                name: hrms-mysql-credentials
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: backup
              mountPath: /backup
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: hrms-mysql-backups
