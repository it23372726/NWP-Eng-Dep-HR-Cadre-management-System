spring.datasource.url=jdbc:h2:mem:hrms_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
debug=false

jwt.secret=test-only-secret-key-please-do-not-use-in-production-0123456789
jwt.expiration=86400000

app.frontend-url=http://localhost:5173

hrms.uploads.employee-photos-dir=${java.io.tmpdir}/hrms-test-employee-photos
hrms.uploads.organization-logo-dir=${java.io.tmpdir}/hrms-test-organization-logo

hrms.bootstrap.super-admin.enabled=true
hrms.bootstrap.super-admin.username=superadmin
hrms.bootstrap.super-admin.password=admin123
